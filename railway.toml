# Railway: use the Dockerfile at repo root
# In the Railway dashboard, also set:
#   Settings → Root Directory = /  (repo root, not whatsapp/)
#   Variables → copy from whatsapp/.env.example (OPENAI_API_KEY, DASHBOARD_*, etc.)
#   Volumes → mount a volume at /app/storage (WhatsApp session + CRM SQLite)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
